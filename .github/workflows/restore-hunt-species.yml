name: Restore missing Hunt species
on:
  push:
    branches: [codex/hunt-framework-collection-pagination]
    paths: [.github/workflows/restore-hunt-species.yml]
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Add only missing species and verify data
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_URL || secrets.PRODUCTION_DATABASE_URL }}
        run: node scripts/restore-missing-hunt-species.mjs --apply
