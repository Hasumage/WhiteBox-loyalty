name: Publish requested Hunt photo posts
on:
  push:
    branches: [codex/hunt-framework-collection-pagination]
    paths: [.github/workflows/publish-hunt-photo-posts.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Publish three posts for the requested account
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_URL || secrets.PRODUCTION_DATABASE_URL }}
          HUNT_POST_AUTHOR_EMAIL: ${{ secrets.HUNT_POST_AUTHOR_EMAIL }}
        run: node scripts/publish-hunt-photo-posts.mjs
