name: Hunt catalog audit

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Gzip/base64 snapshot from scripts/audit-hunt-catalog.mjs --snapshot
        required: true
        type: string
  push:
    branches: [codex/hunt-framework-collection-pagination]
    paths: [.github/workflows/hunt-catalog-audit.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Compare catalog without modifying database
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_URL || secrets.PRODUCTION_DATABASE_URL }}
          HUNT_CATALOG_BASELINE: ${{ inputs.baseline || '' }}
        run: node scripts/audit-hunt-catalog.mjs
